name: Deploy
on:
  push:
    branches: [__DEPLOY_BRANCH__]
    paths:
__DEPLOY_PATHS__

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '__PHP_VERSION__' }
      - run: composer install
      # - run: php artisan test --compact
      - uses: actions/setup-node@v4
        with: { node-version: '__NODE_VERSION__' }
      - run: npm ci
      - run: npm run build

  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
__IMAGE_FILTER_PATHS__
            compose:
              - 'docker/compose.prod.yaml'

  deploy:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs.image == 'true'
      - uses: docker/login-action@v3
        if: needs.changes.outputs.image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: needs.changes.outputs.image == 'true'
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # latest = current prod; sha = immutable tag for rollback
          tags: |
            __GHCR_IMAGE__:latest
            __GHCR_IMAGE__:${{ github.sha }}

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd __SERVER_DIR__
            git pull origin __DEPLOY_BRANCH__
            if [ "${{ needs.changes.outputs.image }}" = "true" ]; then
              export APP_IMAGE_TAG=${{ github.sha }}
              echo "$APP_IMAGE_TAG" > .app_image_tag
            elif [ -f .app_image_tag ]; then
              export APP_IMAGE_TAG=$(cat .app_image_tag)
            else
              export APP_IMAGE_TAG=latest
            fi
            docker compose -f docker/compose.prod.yaml pull app
            docker compose -f docker/compose.prod.yaml up -d__COMPOSE_UP_SCALE__
            docker compose -f docker/compose.prod.yaml exec app php artisan migrate --force
